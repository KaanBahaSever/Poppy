name: Release

# Manual only: releases are built locally with ./publish.ps1. This is a fallback started by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 1.0.5)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build installer, update feed and Store package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          ./build.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          # vpk publishes the installer, the full and delta packages and the update feed.
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN `
            -o artifacts/release --tag $tag --releaseName "Poppy $version" --targetCommitish "${{ github.sha }}" --publish
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }
          gh release upload $tag (Get-ChildItem artifacts/release -Filter "*.msix").FullName --clobber
          gh release edit $tag --notes-file docs/RELEASE_NOTES.md

      - name: Upload winget manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: artifacts/winget
